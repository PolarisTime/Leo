global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: leo-backend
    # 生产使用独立管理端口 57218：management.server.base-path=/api + endpoints.web.base-path=/v2.0/actuator
    metrics_path: /api/v2.0/actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:57218
        labels:
          service: leo

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
