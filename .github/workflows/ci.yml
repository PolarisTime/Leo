name: backend-ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Architecture gates
        run: |
          bash scripts/check-java-module-boundaries.sh
          bash scripts/verify-modulith-architecture.sh

      # 迁移政策门禁（无需数据库）：
      #   1) V1__baseline.sql 的 sha256 冻结：基线不可改写，内容一改即红。官方 flyway:validate
      #      是“库中记录与本地脚本是否对齐”的收官校验，不是“基线有没有被改写”的政策闸门，
      #      这里用独立门禁兜底；它不是 drift 检测（drift 属 Flyway Enterprise 功能）。
      #   2) 流水线与部署脚本禁止出现 Flyway 的 repair goal / 子命令：repair 会直接改写
      #      flyway_schema_history，进了流水线就会把“迁移对不上”静默抹平。
      - name: 迁移门禁：V1 基线冻结与 repair 守卫
        run: |
          bash scripts/deploy/assert-flyway-baseline-frozen.sh .
          bash scripts/deploy/assert-no-migration-repair.sh

      # 压测套件离线自检：全部用本地桩服务/合成数据离线运行，不依赖后端、DB、Redis 与 k6。
      # 防护三类「工具骗人」的假数据：
      #   1) token 守卫失效 → 把 JWT 过期 401 误读成 Redis 故障（token-guard）；
      #   2) 泄漏检测器把 GC 锯齿噪声误报成内存泄漏（leak-detector）；
      #   3) 指标采集器反复登录顶掉压测会话 → 大面积 401 却无业务异常
      #      （collector-login / login-invariant：登录次数硬不变量，超限必须失败而非告警）；
      #   4) 脚本调用未定义函数（bash -n 查不出的运行时错误）。
      # 任何一步非零退出即 job 失败。
      - name: 压测套件离线自检（登录次数不变量/token守卫/泄漏误报假数据，无需后端与 Redis）
        run: |
          bash perf/test/token-guard-selftest.sh
          bash perf/test/leak-detector-selftest.sh
          bash perf/test/collector-login-selftest.sh
          bash perf/test/login-invariant-selftest.sh
          python3 perf/check-undefined-funcs.py perf/*.sh

      - name: Static analysis
        run: bash scripts/maven.sh -B -ntp -DskipTests checkstyle:check spotbugs:check

  package:
    name: Package & Smoke
    needs: static-analysis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leo
          POSTGRES_USER: leo
          POSTGRES_PASSWORD: leo_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leo -d leo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        shell: bash

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/leo
      SPRING_DATASOURCE_USERNAME: leo
      SPRING_DATASOURCE_PASSWORD: leo_ci_password
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 3
      SPRING_DATA_REDIS_PASSWORD: ""
      LEO_JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      LEO_DATA_ENCRYPTION_KEY: ci-data-secret-ci-data-secret-ci-data
      LEO_MACHINE_ID: 1
      # 口径/迁移类的真实库回归(@DataJpaTest + @EnabledIfEnvironmentVariable)默认被跳过, 不设这个变量
      # 时多行采购订单关联、分配吨位汇总、整单替换版本等断言在 CI 只是"假绿"; 这里显式开启,
      # 让它们在下面的 postgres service(已由 flyway:migrate 建好 schema)上真正执行。
      LEO_TEST_POSTGRES: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Verify Flyway migrations
        run: |
          bash scripts/maven.sh -B -ntp flyway:migrate \
            -Dflyway.url="$SPRING_DATASOURCE_URL" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dflyway.locations="filesystem:src/main/resources/db/migration" \
            -Dflyway.cleanDisabled=true \
            -Dflyway.placeholderReplacement=false \
            -Dflyway.validateMigrationNaming=true
          bash scripts/maven.sh -B -ntp flyway:validate \
            -Dflyway.url="$SPRING_DATASOURCE_URL" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dflyway.locations="filesystem:src/main/resources/db/migration" \
            -Dflyway.cleanDisabled=true \
            -Dflyway.placeholderReplacement=false \
            -Dflyway.validateMigrationNaming=true

      # 承接上面 migrate/validate 的 SQL 断言门禁：validate 只说明“库中记录与本地脚本对齐”，
      # 不回答“目标版本这条迁移到底跑没跑”。这里直接查 flyway_schema_history 并失败即红：
      #   success=false 行数必须为 0；目标版本恰 1 行且 success=true、checksum 非空；
      #   max(已成功版本) 必须等于 verify-flyway-target.sh 输出；目标版本必须等于代码库最新版本
      #   （把 target 调低后“看起来绿”同样失败）。查询证据写入 flyway-history-gate.txt 留档。
      # 目标版本由 verify-flyway-target.sh 解析（当前为 186），不硬编码，新增迁移无需改 workflow。
      - name: Flyway 历史断言门禁（success / 目标版本 / checksum / max 版本）
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: leo
        run: |
          set -euo pipefail
          export PGUSER="$SPRING_DATASOURCE_USERNAME"
          export PGPASSWORD="$SPRING_DATASOURCE_PASSWORD"
          flyway_target="$(bash scripts/deploy/verify-flyway-target.sh .)"
          bash scripts/deploy/assert-flyway-history.sh --target "$flyway_target" --report flyway-history-gate.txt

      - name: Flyway 门禁负例自检（改错即变红）
        if: always()
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: leo
        run: |
          set -euo pipefail
          export PGUSER="$SPRING_DATASOURCE_USERNAME"
          export PGPASSWORD="$SPRING_DATASOURCE_PASSWORD"
          bash scripts/deploy/test/assert-flyway-history-selftest.sh 2>&1 | tee flyway-gate-selftest.txt

      # flyway info 输出留档：pending/success/checksum 的原始视图，故障复盘时不必再连库重算。
      - name: 采集 flyway info 证据（artifact 留档）
        if: always()
        run: |
          bash scripts/maven.sh -B -ntp flyway:info \
            -Dflyway.url="$SPRING_DATASOURCE_URL" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dflyway.locations="filesystem:src/main/resources/db/migration" \
            -Dflyway.cleanDisabled=true \
            -Dflyway.placeholderReplacement=false \
            -Dflyway.validateMigrationNaming=true 2>&1 | tee flyway-info.txt

      - name: Upload flyway migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flyway-migration-evidence
          path: |
            flyway-info.txt
            flyway-history-gate.txt
            flyway-gate-selftest.txt
          if-no-files-found: warn

      - name: Test & Package
        run: bash scripts/maven.sh -B -ntp package

      - name: Build backend image
        run: docker build -t leo-backend:ci .

      - name: Smoke test backend image
        run: |
          latest_migration="$(find src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' -printf '%f\n' | sort -V | tail -1)"
          flyway_target="${latest_migration#V}"
          flyway_target="${flyway_target%%__*}"
          bash scripts/deploy/verify-flyway-target.sh . "$flyway_target"
          docker run -d --name leo-backend-smoke \
            --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            -e SPRING_FLYWAY_ENABLED=false \
            -e SPRING_FLYWAY_TARGET="$flyway_target" \
            -e SPRING_DATA_REDIS_HOST=localhost \
            -e SPRING_DATA_REDIS_PORT="$SPRING_DATA_REDIS_PORT" \
            -e SPRING_DATA_REDIS_DATABASE="$SPRING_DATA_REDIS_DATABASE" \
            -e SPRING_DATA_REDIS_PASSWORD="$SPRING_DATA_REDIS_PASSWORD" \
            -e LEO_JWT_SECRET="$LEO_JWT_SECRET" \
            -e LEO_DATA_ENCRYPTION_KEY="$LEO_DATA_ENCRYPTION_KEY" \
            -e LEO_MACHINE_ID="$LEO_MACHINE_ID" \
            leo-backend:ci
          trap 'docker ps -a --filter name=leo-backend-smoke; docker logs leo-backend-smoke --tail 300 || true; docker rm -f leo-backend-smoke || true' EXIT
          timeout 240 bash -c 'until curl --max-time 5 -fsS http://127.0.0.1:11211/api/v2.0/health; do sleep 3; done'

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: leo-backend-jar
          path: target/*.jar
          if-no-files-found: error
