leo:
  auth:
    cookie:
      # 生产环境默认仅通过 HTTPS 发送 refresh token cookie
      secure: ${LEO_AUTH_REFRESH_COOKIE_SECURE:true}
      # 生产环境默认进一步收紧跨站携带策略
      same-site: ${LEO_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
  health:
    page:
      # 生产环境默认关闭 HTML 健康页
      enabled: ${LEO_HEALTH_PAGE_ENABLED:false}
  surface:
    health:
      # 生产环境默认不向匿名请求暴露健康页
      public-access-enabled: ${LEO_HEALTH_PAGE_PUBLIC_ACCESS_ENABLED:false}
    docs:
      # 生产环境默认不向匿名请求暴露 OpenAPI / Swagger 文档
      public-access-enabled: ${LEO_DOCS_PUBLIC_ACCESS_ENABLED:false}
    version:
      # 生产环境不返回精确提交哈希：/version 是匿名端点，
      # 哈希可让攻击者定位该提交之后修复的缺陷（定向利用而非盲扫）
      expose-commit-hash: ${LEO_VERSION_EXPOSE_COMMIT_HASH:false}
  security:
    web:
      cors:
        # 生产环境必须显式声明前端来源，禁止沿用 application.yml 里的 localhost 开发默认值。
        # 这里的空默认值是**故意的**：变量未设置或为空时绑定成空列表，由
        # ProdCorsStartupValidator 抛出点名 LEO_CORS_ALLOWED_ORIGINS 的可操作报错。
        # 不用无默认值的 ${LEO_CORS_ALLOWED_ORIGINS}，是因为那样只能换来 Spring 的占位符
        # 解析异常，且接不住「设了但为空 / 把 localhost 原文带进生产 / 带末尾斜杠」这三类
        # 同样静默的误配 —— 它们都会让生产静默跑在错误的 CORS 策略上。
        allowed-origins: ${LEO_CORS_ALLOWED_ORIGINS:}
      headers:
        # 生产环境 HTTPS 就绪后默认启用 HSTS
        hsts-enabled: ${LEO_SECURITY_HSTS_ENABLED:true}
  id:
    # 生产环境默认禁止使用 machine-id=0，避免多实例部署 ID 冲突。
    strict-machine-id: ${LEO_ID_STRICT_MACHINE_ID:true}
spring:
  datasource:
    # 生产环境默认连接 prod 库，可通过 SPRING_DATASOURCE_URL 或 SPRING_DATASOURCE_DB 覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:prod}}
  jpa:
    properties:
      hibernate:
        # 生产环境不需要 SQL 格式化输出
        format_sql: false
  flyway:
    # 生产迁移必须显式选择阶段上限，禁止随着制品中的脚本自动迁移到 latest
    target: ${SPRING_FLYWAY_TARGET:}

server:
  tomcat:
    accesslog:
      # 生产默认开启访问日志(含 traceId), 落盘到 LEO_LOG_PATH
      enabled: ${LEO_ACCESS_LOG_ENABLED:true}

management:
  server:
    # 指标端口仅绑定本机，由同机 Prometheus 拉取，不经过业务 Nginx。
    address: ${LEO_MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${LEO_MANAGEMENT_SERVER_PORT:57218}
  endpoints:
    web:
      exposure:
        include: ${LEO_MANAGEMENT_ENDPOINTS:health,prometheus,loggers,configprops}
  tracing:
    sampling:
      # 生产默认按 10% 采样；排障时可临时通过环境变量提高。
      probability: ${LEO_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  level:
    com.leo.erp.system.web.HealthPageController: WARN
